name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.3'
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l *.go)"
      - run: go test ./...
      - name: Build CoreDNS with recurse
        shell: bash
        run: |
          git clone --depth 1 --branch v1.13.1 https://github.com/coredns/coredns.git "$RUNNER_TEMP/coredns"
          cd "$RUNNER_TEMP/coredns"
          sed -i '/^forward:forward/i recurse:github.com/MKrupauskas/coredns-recurse' plugin.cfg
          go mod edit -replace github.com/MKrupauskas/coredns-recurse="$GITHUB_WORKSPACE"
          go get github.com/MKrupauskas/coredns-recurse
          go generate
          go build -o coredns .
          ./coredns -plugins | grep -x recurse
